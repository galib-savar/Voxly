<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxly — Social Media for Creators</title>
    <!-- * Description -->
    <meta
      name="description"
      content="Voxly is a social media platform for creators to share ideas, connect with their audience, and build their community."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- * Canonical -->
    <link
      rel="canonical"
      href="https://voxly-frontend-teal.vercel.app/l.vercel.app/"
    />
    <!-- * Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Voxly — Social Media for Creators" />
    <meta property="og:url" content="https://voxly-frontend-teal.vercel.app/" />
    <meta
      property="og:image"
      content="https://voxly-frontend-teal.vercel.app/og.png"
    />
    <meta
      property="og:description"
      content="Share your ideas, connect with your audience, and build your community on Voxly."
    />
    <!-- * X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Voxly — Social Media for Creators" />
    <meta
      name="twitter:description"
      content="Share your ideas, connect with your audience, and build your community on Voxly."
    />
    <meta
      name="twitter:image"
      content="https://voxly-frontend-teal.vercel.app/og.png"
    />
    <meta
      name="twitter:image:alt"
      content="Voxly — Social Media for Creators"
    />
    <!-- * Theme -->
    <meta name="theme-color" content="#000000" />
    <!-- * Icons -->
    <link rel="icon" type="image/x-icon" href="/favicons/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicons/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicons/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/favicons/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/favicons/android-chrome-512x512.png"
    />
    <!-- * Web App -->
    <link rel="manifest" href="favicons/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
